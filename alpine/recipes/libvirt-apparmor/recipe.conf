# recipe.conf of libvirt-apparmor: the package set and what the job checks of it.
# Data, read by hps-apk-build with a strict parser (alpine/recipes/libvirt-apparmor/PINS
# holds the pins; docs/BUILDER.md "Local packages: the Alpine chroot" the whole job).

# the APKBUILD's pkgname
pkgname=libvirt
# the meta package; also the recipe's name and the output's (out/pkgs/<meta>/)
meta=libvirt-apparmor
# the subpackages the node needs, as Alpine's APKBUILD splits them: `main` is libvirt
# itself, anything else is libvirt-<part>. The meta package depends on exactly these at
# the version-release the build made (read from the built files). The rest of the split
# (dev, doc, dbg, lang, bash-completion, lxc, vbox, xen) is built and not published.
parts=main client daemon daemon-openrc libs qemu common-drivers
# the patch applied to the pinned APKBUILD (data; applied with patch -F0)
patch=APKBUILD.patch
# the release the patch sets; a built package below it means the patch did not take
min_pkgrel=100

# checks of the built set. The helper must be in a package of the set, at the place the
# node's adapter looks (node-manager/bundle/adapter/alpine.sh aa_helper_path).
helper=usr/lib/libvirt/virt-aa-helper
# the AppArmor security driver is compiled into libvirt.so, with the helper's path as a
# string constant (src/security/security_apparmor.c: VIRT_AA_HELPER); a build without
# the driver has no such string in any library
driver_string=/usr/lib/libvirt/virt-aa-helper
# upstream would install its own profile texts here with -Dapparmor_profiles=enabled; the
# patch turns that off and the set must hold nothing under it (node-manager/apparmor/ is
# the one source of the texts)
forbid_prefix=etc/apparmor.d
