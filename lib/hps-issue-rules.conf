# hps-issue-rules.conf - the triggers of hps-issue-watch (docs/ISSUES.md).
#
# hps-issue-watch follows every node's syslog on the IPS and puts each new line
# through these rules. Read once at start: restart hps-issue-watch to apply a
# change (supervisorctl restart hps-issue-watch).
#
# The primary mechanism is the marker a node logs itself (logger -t hps-issue):
#   HPS-ISSUE open kind=<kind> k=v ...      opens (or adds to) an issue
#   HPS-ISSUE resolve kind=<kind> k=v ...   resolves it
# Any kind works. A "marker" rule says which fields key a kind (the same key
# opens and resolves) and its severity; a kind with no marker rule is keyed by
# host alone, severity warning; severity=urgent|warning in the marker wins.
#
#   marker  <kind>  <severity>  <key fields>
#
# The other rules catch raw lines (a node that never logs the marker):
#
#   open     <kind>  <severity>  <key fields>  [after=N/S]  <regex>
#   resolve  <kind>  -           <key fields>  <regex>
#
# The regex (Perl) is matched against "<tag>: <message>" of the line; its named
# captures, plus host (the line's host name, short), are the fields. Every key
# field must be among them. after=N/S opens only at the Nth match of the same
# key within S seconds (for lines that repeat while things recover by
# themselves). Keep this list short: every line of every node passes it.

# --- markers -------------------------------------------------------------------
# The mdadm monitor on a node (one per mirror):
#   HPS-ISSUE open kind=mirror-leg host=<short host> mirror=<name> component=<dev or -> event=<Fail|FailSpare|DegradedArray> [leg=<iqn>@<ip>:3260]
#   HPS-ISSUE resolve kind=mirror-leg host=<short host> mirror=<name> event=<RebuildFinished|RecoveryFinished|SpareActive>
# (resolve is logged only when the array is no longer degraded).
# The IPS heals these itself (mirror-rejoin; HPS::IssueHeal).
marker  mirror-leg  warning  host,mirror

# --- raw kernel and iSCSI fallbacks --------------------------------------------
# The kernel failing a RAID1 member. md is the kernel name (md127), not the
# mirror name: the healer then checks every mirror of the host. A clean stop
# (hps-workload stop: mirror-stop stops the array, then logs out its iSCSI
# sessions) logs no Disk failure, so it opens nothing.
open  mirror-leg  warning  host,md  ^kernel: (?:\[ *[0-9.]+\] )?md/raid1:(?<md>md[0-9]+): Disk failure on (?<component>[A-Za-z0-9_-]+), disabling device

# The iSCSI initiator failing to reach a portal, repeatedly (one failure is a
# normal reconnect); and the session coming back. Keyed by host: the recovery
# line does not name the portal.
open     storage-path  warning  host  after=3/300  ^iscsid: .*connect to (?<portal>[0-9.]+:[0-9]+) failed
resolve  storage-path  -        host  ^iscsid: connection[0-9]+:[0-9]+ is operational (?:after recovery|now)
