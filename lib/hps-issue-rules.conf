# hps-issue-rules.conf - the triggers of hps-issue-watch (docs/ISSUES.md).
#
# hps-issue-watch follows every node's syslog on the IPS and puts each new line
# through these rules. Read once at start: restart hps-issue-watch to apply a
# change (supervisorctl restart hps-issue-watch).
#
# The primary mechanism is the marker a node logs itself (logger -t hps-issue):
#   HPS-ISSUE open kind=<kind> k=v ...      opens (or adds to) an issue
#   HPS-ISSUE resolve kind=<kind> k=v ...   resolves it
# Any kind works. A "marker" rule says which fields key a kind (the same key
# opens and resolves) and its severity; a kind with no marker rule is keyed by
# host alone, severity warning; severity=urgent|warning in the marker wins.
#
#   marker  <kind>  <severity>  <key fields>
#
# The other rules catch raw lines (a node that never logs the marker):
#
#   open     <kind>  <severity>  <key fields>  [from=ips] [after=N/S] [urgent_after=S]  <regex>
#   resolve  <kind>  -           <key fields>  [from=ips] [settle=S]  <regex>
#
# The regex (Perl) is matched against "<tag>: <message>" of the line; its named
# captures, plus host (the line's host name, short), are the fields. Every key
# field must be among them. after=N/S opens only at the Nth match of the same
# key within S seconds (for lines that repeat while things recover by
# themselves). settle=S (resolve rules): the resolve waits S seconds and an open
# of the same key in that time cancels it (lines that end and begin a period at
# once). urgent_after=S (open rules): the issue becomes urgent when it is still
# unresolved S seconds after it opened. from=ips: the rule is for the IPS's own hps lines
# (<log>/ips/hps/<date>.log: hps-monitor's results), and only for them; markers
# are never read there. A line whose host (a captured host, else the line's) is
# not a host of this cluster's registry sending from one of its own addresses
# opens and resolves nothing (another cluster's forwarded syslog). Keep this list short: every line passes it.

# --- markers -------------------------------------------------------------------
# The mdadm monitor on a node (one per mirror):
#   HPS-ISSUE open kind=mirror-leg host=<short host> mirror=<name> component=<dev or -> event=<Fail|FailSpare|DegradedArray> [leg=<iqn>@<ip>:3260]
#   HPS-ISSUE resolve kind=mirror-leg host=<short host> mirror=<name> event=<RebuildFinished|RecoveryFinished|SpareActive>
# (resolve is logged only when the array is no longer degraded).
# The IPS heals these itself (mirror-rejoin; HPS::IssueHeal).
marker  mirror-leg  warning  host,mirror

# (The kernel's "md/raid1:mdN: Disk failure on <dev>" is not a rule: the mdadm
# monitor's marker reports the same failure by mirror name, and a second issue
# keyed by the kernel name only duplicated it.)

# --- raw iSCSI lines -----------------------------------------------------------
# The iSCSI initiator failing to reach a portal, repeatedly (one failure is a
# normal reconnect); and a session coming back. Keyed by host: the recovery
# lines do not all name the portal. iscsid logs its own name again at the start
# of the message ("iscsid: iscsid: connection2:0 ..."), and the login line is
# "Connection1:0 to [target: ..., portal: ...] through [iface: ...] is
# operational now".
open     storage-path  warning  host  after=3/300  ^iscsid: .*connect to (?<portal>[0-9.]+:[0-9]+) failed
resolve  storage-path  -        host  ^iscsid: (?:iscsid: )?[Cc]onnection[0-9]+:[0-9]+ (?:to \[[^\]]*\] through \[[^\]]*\] )?is operational (?:after recovery|now)

# --- ZFS pools on storage hosts ------------------------------------------------
# The kernel reporting an I/O error on a pool disk:
#   kernel: zio pool=s1 vdev=/dev/disk/by-id/virtio-s1-sch-001-d3-part1 error=5 type=2 ...
# keyed by host, pool and the vdev as zpool status names it (the -partN of the
# partition ZFS made on a whole disk is not part of it). A failing disk logs
# many; they add to the one issue. The IPS heals it (storage-vdev-online:
# zpool online and clear once the disk is back; HPS::IssueHeal) and resolves it
# when zpool status shows the vdev ONLINE with no resilver running.
open  zfs-vdev  warning  host,pool,vdev  ^kernel: (?:\[ *[0-9.]+\] )?zio pool=(?<pool>[a-z][a-z0-9_.-]*) vdev=/dev/disk/by-id/(?<vdev>[A-Za-z0-9][A-Za-z0-9_.:+-]*?)(?:-part[0-9]+)? error=

# hps-monitor's zpool check of a storage host (the IPS's own lines):
#   hps: hps-monitor: host=sch-001.s1.hps check=zpool state=WARNING ZPOOL WARNING - 1 pools: s1=DEGRADED | ...
# DEGRADED is a warning, FAULTED and worse urgent; keyed by host and the first
# pool in that state. The check reporting OK resolves it (keyed by the first
# pool it lists: an HPS storage host has one pool); so does the healer when it
# heals the last zfs-vdev issue of that pool and the pool is ONLINE.
open     zfs-pool  warning  host,pool  from=ips  ^hps: hps-monitor: host=(?<host>\S+) check=zpool state=WARNING ZPOOL WARNING - .*?\b(?<pool>[a-z][a-z0-9_.-]*)=(?<health>DEGRADED)\b
open     zfs-pool  urgent   host,pool  from=ips  ^hps: hps-monitor: host=(?<host>\S+) check=zpool state=CRITICAL ZPOOL CRITICAL - .*?\b(?<pool>[a-z][a-z0-9_.-]*)=(?<health>FAULTED|UNAVAIL|OFFLINE|REMOVED|SUSPENDED)\b
resolve  zfs-pool  -        host,pool  from=ips  ^hps: hps-monitor: host=(?<host>\S+) check=zpool state=OK ZPOOL OK - [0-9]+ pools: (?<pool>[a-z][a-z0-9_.-]*)=ONLINE\b

# --- OpenSVC (om3) heartbeat ---------------------------------------------------
# om3 logs a pair per peer when it cannot send the heartbeat to it, and when it
# can again (often twice: once with its own time and level in front, once
# without):
#   om: 15:21:35.040 WRN daemon: hb: ucast: tx: hb#1: begin a send error period for node sch-002.s1.hps: dial tcp ...: connect: connection refused
#   om: daemon: hb: ucast: tx: hb#1: end a send error period for node sch-002.s1.hps: ...
# Keyed by host (the sender) and peer (short name), not by hb#: the flood adds
# to one issue per pair. An "end" is followed at once by a new "begin" when only
# the error changed (no route to host, then connection refused): settle=30 holds
# the resolve back 30 s and a "begin" of the same pair in that time cancels it.
# urgent_after=600: still open after 10 minutes, it becomes urgent. Not healed:
# the peer is down or unreachable (hps-monitor's osvc_hb check grades it).
open     om3-hb  warning  host,peer  urgent_after=600  ^om: (?:[0-9:.]+ [A-Z]{3} )?daemon: hb: [a-z]+: tx: hb#[0-9]+: begin a send error period for node (?<peer>[A-Za-z0-9][A-Za-z0-9-]*)
resolve  om3-hb  -        host,peer  settle=30         ^om: (?:[0-9:.]+ [A-Z]{3} )?daemon: hb: [a-z]+: tx: hb#[0-9]+: end a send error period for node (?<peer>[A-Za-z0-9][A-Za-z0-9-]*)
